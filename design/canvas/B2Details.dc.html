<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PeakBook — Guest details, yurt stay, mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F4ED}
*{box-sizing:border-box}
a{color:#173F35}a:hover{color:#0E2A23}
:focus-visible{outline:3px solid #173F35;outline-offset:3px}
input[type=radio]{width:22px;height:22px;accent-color:#173F35;margin:0;flex:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1300px; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #202925; font-size: 16px; line-height: 1.45; background: #F7F4ED">
  <header style="display: flex; align-items: center; gap: 8px; padding: 8px 16px 8px 8px; border-bottom: 1px solid #E3DDD0">
    <a href="B1Yurt.dc.html" aria-label="Back to stay" style="width: 44px; height: 44px; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#202925" stroke-width="2" aria-hidden="true"><path d="M12 4l-6 6 6 6"/></svg></a>
    <span style="flex: 1"><b>Your details</b><br><span style="font-size: 13px; color: #57605B">Step 2 of 4 · Song-Kul · 16–18 Jul · 2 guests</span></span>
  </header>
  <div role="progressbar" aria-valuenow="2" aria-valuemin="1" aria-valuemax="4" aria-label="Step 2 of 4" style="height: 4px; background: #E3DDD0"><div style="width: 50%; height: 4px; background: #173F35"></div></div>

  <form style="padding: 20px 16px 0; display: grid; gap: 18px">
    <p style="margin: 0; font-size: 13px; color: #57605B; display: flex; gap: 8px; align-items: center"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#57605B" stroke-width="1.8" aria-hidden="true"><path d="M4 10.5l4 4 8-9"/></svg>Saved on this phone as you type.</p>
    <label style="display: grid; gap: 6px; font-size: 14px; font-weight: 600">Full name<input autocomplete="name" value="Azamat Sadykov" style="min-height: 48px; padding: 0 14px; border: 1px solid #CFC7B6; border-radius: 10px; background: #FFFDF8; font: 400 16px Inter, sans-serif"></label>
    <div style="display: grid; gap: 6px">
      <span id="pl" style="font-size: 14px; font-weight: 600">Mobile phone</span>
      <div role="group" aria-labelledby="pl" style="display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px">
        <select aria-label="Country code" style="min-height: 48px; padding: 0 10px; border: 1px solid #CFC7B6; border-radius: 10px; background: #FFFDF8; font: 400 16px Inter, sans-serif"><option>KG +996</option></select>
        <input type="tel" aria-label="Phone number" value="700 123 456" style="min-height: 48px; padding: 0 14px; border: 1px solid #CFC7B6; border-radius: 10px; background: #FFFDF8; font: 400 16px Inter, sans-serif">
      </div>
    </div>
    <fieldset style="border: 0; padding: 0; margin: 0; display: grid; gap: 4px"><legend style="font-size: 14px; font-weight: 600; margin-bottom: 6px">How should the host contact you?</legend>
      <label style="display: flex; gap: 12px; align-items: center; min-height: 48px"><input type="radio" name="c" checked> WhatsApp</label>
      <label style="display: flex; gap: 12px; align-items: center; min-height: 48px"><input type="radio" name="c"> Telegram <span style="font-size: 13px; color: #8A5A17">· design state</span></label>
      <label style="display: flex; gap: 12px; align-items: center; min-height: 48px"><input type="radio" name="c"> Phone call</label>
    </fieldset>
    <label style="display: grid; gap: 6px; font-size: 14px; font-weight: 600">Email <span style="font-weight: 400; color: #57605B">optional, for your confirmation</span><input type="email" placeholder="name@mail.kg" style="min-height: 48px; padding: 0 14px; border: 1px solid #CFC7B6; border-radius: 10px; background: #FFFDF8; font: 400 16px Inter, sans-serif"></label>
    <label style="display: grid; gap: 6px; font-size: 14px; font-weight: 600">Meet for the transfer in Kochkor<select style="min-height: 48px; padding: 0 12px; border: 1px solid #CFC7B6; border-radius: 10px; background: #FFFDF8; font: 400 16px Inter, sans-serif"><option>Kochkor bus station · 10:00</option><option>Kochkor bus station · 14:00</option></select></label>
    <label style="display: grid; gap: 6px; font-size: 14px; font-weight: 600">Diets or allergies<textarea placeholder="Optional" style="min-height: 72px; padding: 12px 14px; border: 1px solid #CFC7B6; border-radius: 10px; background: #FFFDF8; font: 400 16px Inter, sans-serif"></textarea><span style="font-weight: 400; color: #3A433E">Gulmira replies about special diets on WhatsApp.</span></label>
  </form>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFDF8; border-top: 1px solid #E3DDD0; padding: 12px 16px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px">
    <span style="line-height: 1.3"><b>18,000 KGS</b><br><span style="font-size: 13px; color: #3A433E">Cash on arrival</span></span>
    <a href="B3Pay.dc.html" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 24px; border-radius: 12px; background: #173F35; color: #F7F4ED; font-weight: 600; text-decoration: none">Review booking</a>
  </div>
</div>
</x-dc>

  renderVals() { return {}; }

</body>
</html>
