<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PeakBook — Filters sheet, mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F4ED}
*{box-sizing:border-box}
a{color:#173F35}a:hover{color:#0E2A23}
:focus-visible{outline:3px solid #173F35;outline-offset:3px}
input[type=checkbox],input[type=radio]{width:22px;height:22px;accent-color:#173F35;margin:0;flex:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1500px; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #202925; font-size: 16px; line-height: 1.45; background: rgba(32,41,37,0.45)">
  <div role="dialog" aria-modal="true" aria-labelledby="ft" style="position: absolute; left: 0; right: 0; top: 48px; bottom: 0; background: #F7F4ED; border-radius: 22px 22px 0 0; display: flex; flex-direction: column">
    <div aria-hidden="true" style="width: 40px; height: 4px; border-radius: 2px; background: #CFC7B6; margin: 10px auto 0"></div>
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 6px 16px; border-bottom: 1px solid #E3DDD0">
      <h2 id="ft" style="margin: 0; font-size: 18px">Filters</h2>
      <a href="MSearch.dc.html" aria-label="Close filters" style="width: 48px; height: 48px; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#202925" stroke-width="2" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></a>
    </div>
    <div style="flex: 1; overflow-y: auto; padding: 0 16px; display: grid; gap: 0; align-content: start">
      <fieldset style="border: 0; border-bottom: 1px solid #E3DDD0; padding: 16px 0; margin: 0"><legend style="font-weight: 600; float: left; width: 100%; margin-bottom: 10px">Dates</legend>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
          <label style="display: flex; gap: 10px; align-items: center; min-height: 48px; padding: 0 12px; border: 2px solid #173F35; border-radius: 12px; background: #FFFDF8"><input type="radio" name="d" checked> Exact dates</label>
          <label style="display: flex; gap: 10px; align-items: center; min-height: 48px; padding: 0 12px; border: 1px solid #D6CFBF; border-radius: 12px; background: #FFFDF8"><input type="radio" name="d"> Flexible month</label>
        </div>
        <p style="margin: 8px 0 0; font-size: 14px; color: #3A433E">3–5 Jul 2027 · <a href="#">Change</a></p>
      </fieldset>
      <fieldset style="border: 0; border-bottom: 1px solid #E3DDD0; padding: 16px 0; margin: 0"><legend style="font-weight: 600; float: left; width: 100%; margin-bottom: 10px">Group size</legend>
        <div style="display: flex; align-items: center; justify-content: space-between"><span>Travelers</span><span style="display: flex; align-items: center; gap: 14px"><button aria-label="Fewer travelers" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #202925; background: transparent; font: 500 20px Inter, sans-serif">−</button><b aria-live="polite">3</b><button aria-label="More travelers" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #202925; background: transparent; font: 500 20px Inter, sans-serif">+</button></span></div>
      </fieldset>
      <fieldset style="border: 0; border-bottom: 1px solid #E3DDD0; padding: 16px 0; margin: 0"><legend style="font-weight: 600; float: left; width: 100%; margin-bottom: 10px">Total budget for 3</legend>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px"><label style="display: grid; gap: 4px; font-size: 13px">Min<input inputmode="numeric" value="0" style="min-height: 48px; padding: 0 12px; border: 1px solid #CFC7B6; border-radius: 10px; font: 400 16px Inter, sans-serif; background: #FFFDF8"></label><label style="display: grid; gap: 4px; font-size: 13px">Max, KGS<input inputmode="numeric" value="60,000" style="min-height: 48px; padding: 0 12px; border: 1px solid #CFC7B6; border-radius: 10px; font: 400 16px Inter, sans-serif; background: #FFFDF8"></label></div>
      </fieldset>
      <fieldset style="border: 0; border-bottom: 1px solid #E3DDD0; padding: 16px 0; margin: 0; display: grid; gap: 4px"><legend style="font-weight: 600; float: left; width: 100%; margin-bottom: 6px">Payment &amp; booking</legend>
        <label style="display: flex; gap: 12px; align-items: center; min-height: 48px"><input type="checkbox"> Pay online</label>
        <label style="display: flex; gap: 12px; align-items: center; min-height: 48px"><input type="checkbox"> Pay the host in cash</label>
        <label style="display: flex; gap: 12px; align-items: center; min-height: 48px"><input type="checkbox"> Instant confirmation</label>
        <label style="display: flex; gap: 12px; align-items: center; min-height: 48px"><input type="checkbox" checked> Free cancellation ≥ 3 days before</label>
      </fieldset>
      <fieldset style="border: 0; border-bottom: 1px solid #E3DDD0; padding: 16px 0; margin: 0; display: grid; gap: 4px"><legend style="font-weight: 600; float: left; width: 100%; margin-bottom: 6px">Difficulty &amp; duration</legend>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px">
          <label style="display: flex; gap: 12px; align-items: center; min-height: 48px"><input type="checkbox" checked> Easy</label>
          <label style="display: flex; gap: 12px; align-items: center; min-height: 48px"><input type="checkbox" checked> 1 day</label>
          <label style="display: flex; gap: 12px; align-items: center; min-height: 48px"><input type="checkbox" checked> Moderate</label>
          <label style="display: flex; gap: 12px; align-items: center; min-height: 48px"><input type="checkbox" checked> 2–4 days</label>
          <label style="display: flex; gap: 12px; align-items: center; min-height: 48px"><input type="checkbox" checked> Hard</label>
          <label style="display: flex; gap: 12px; align-items: center; min-height: 48px"><input type="checkbox"> 5+ days</label>
        </div>
        <label style="display: grid; gap: 4px; font-size: 14px; margin-top: 6px">Highest point up to<select style="min-height: 48px; padding: 0 12px; border: 1px solid #CFC7B6; border-radius: 10px; font: 400 16px Inter, sans-serif; background: #FFFDF8"><option>Any altitude</option></select></label>
      </fieldset>
      <fieldset style="border: 0; border-bottom: 1px solid #E3DDD0; padding: 16px 0; margin: 0; display: grid; gap: 4px"><legend style="font-weight: 600; float: left; width: 100%; margin-bottom: 6px">Guide &amp; group</legend>
        <label style="display: grid; gap: 4px; font-size: 14px">Guide speaks<select style="min-height: 48px; padding: 0 12px; border: 1px solid #CFC7B6; border-radius: 10px; font: 400 16px Inter, sans-serif; background: #FFFDF8"><option>Any language</option><option>English</option><option>Русский</option><option>Кыргызча</option></select></label>
        <label style="display: flex; gap: 12px; align-items: center; min-height: 48px"><input type="checkbox"> Private group only</label>
        <label style="display: flex; gap: 12px; align-items: center; min-height: 48px"><input type="checkbox"> Transport included</label>
      </fieldset>
      <fieldset style="border: 0; padding: 16px 0 24px; margin: 0; display: grid; gap: 4px"><legend style="font-weight: 600; float: left; width: 100%; margin-bottom: 6px">For yurt stays</legend>
        <label style="display: flex; gap: 12px; align-items: center; min-height: 48px"><input type="checkbox"> Private yurt</label>
        <label style="display: flex; gap: 12px; align-items: center; min-height: 48px"><input type="checkbox"> Meals included</label>
        <label style="display: flex; gap: 12px; align-items: center; min-height: 48px"><input type="checkbox"> Shower on site</label>
        <label style="display: flex; gap: 12px; align-items: center; min-height: 48px"><input type="checkbox"> Indoor or private toilet</label>
        <label style="display: grid; gap: 4px; font-size: 14px">Show stay prices<select style="min-height: 48px; padding: 0 12px; border: 1px solid #CFC7B6; border-radius: 10px; font: 400 16px Inter, sans-serif; background: #FFFDF8"><option>Total for my group</option><option>Per person per night</option><option>Per yurt per night</option></select></label>
      </fieldset>
    </div>
    <div style="display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 12px 16px 20px; border-top: 1px solid #E3DDD0; background: #FFFDF8">
      <button style="min-height: 48px; padding: 0 10px; border: 0; background: transparent; font: 600 16px Inter, sans-serif; color: #173F35; text-decoration: underline">Clear all</button>
      <a href="MSearch.dc.html" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 24px; border-radius: 12px; background: #173F35; color: #F7F4ED; font-weight: 600; text-decoration: none">Show 5 trips</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
